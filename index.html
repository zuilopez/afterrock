<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>afterROCK</title>
<meta name="description" content="afterROCK — hub of all pages by Luiz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FBF8F6;--fg:#151116;--muted:#857A82;--line:#E6DEE1;--chip:#F2ECEE;
  --pink:#E5306B;--orange:#F2883A;--teal:#139C97;--dusk:#5B3B8C;--hover:#F5EFF1;
  --display:"Big Shoulders Display","Archivo",Impact,"Arial Narrow",sans-serif;
  --body:"Archivo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#110D13;--fg:#F3EDF0;--muted:#9A8E96;--line:#2A2229;--chip:#1E1820;--pink:#FF4F86;--teal:#2EC4BE;--hover:#19141B;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#110D13;--fg:#F3EDF0;--muted:#9A8E96;--line:#2A2229;--chip:#1E1820;--pink:#FF4F86;--teal:#2EC4BE;--hover:#19141B;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  transition:background .3s,color .3s}
.wrap{max-width:1240px;margin:0 auto}
a{color:inherit}

/* header */
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;
  font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
header .brand{color:var(--fg);font-size:13px;text-decoration:none}
header .right{display:flex;align-items:center;gap:14px}
button.theme{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);align-items:end;gap:16px;padding:44px 0 28px;border-bottom:1px solid var(--line)}
.hero h1{margin:0;font:900 clamp(52px,11vw,180px)/.8 var(--display);letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:anywhere}
.hero h1 em{font-style:normal;color:var(--pink)}
.hero p{margin:0;font:400 13px/1.5 var(--mono);color:var(--muted);max-width:420px}

/* filters */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* sections + grid */
section{margin-top:8px}
section h2{display:flex;justify-content:space-between;margin:28px 0 0;padding:10px 0;border-top:1px solid var(--fg);
  font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
section h2 span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
a.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:280px;padding:16px;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-decoration:none;transition:background .25s}
a.tile:hover,a.tile:focus-visible{background:var(--hover);outline:none}
a.tile:focus-visible{box-shadow:inset 0 0 0 2px var(--pink)}
.tile .top{display:flex;justify-content:space-between;gap:8px;font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .tag{display:inline-flex;align-items:center;gap:6px}
.tile .tag i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--pink));display:inline-block}
.tile strong{display:block;font:900 clamp(72px,9vw,120px)/.82 var(--display);text-transform:uppercase;color:var(--c,var(--pink));
  word-break:normal;overflow-wrap:normal;hyphens:manual;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.tile strong.long{font-size:clamp(40px,4.6vw,60px);line-height:.9}
a.tile:hover strong{transform:translateX(4px)}
.tile .d{font:400 13px/1.45 var(--body);color:var(--fg);margin:0 0 10px}
.tile .meta{display:flex;justify-content:space-between;gap:8px;font:400 11px/1.3 var(--mono);color:var(--muted);word-break:break-all}
.tile .meta b{font-weight:500;color:var(--fg);white-space:nowrap}

footer{margin-top:48px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;
  font:400 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr);padding-top:32px}
  .hero p{text-align:left;max-width:none}
  a.tile{min-height:220px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="./"><b>afterROCK</b></a>
    <div class="right">
      <span id="ver"></span>
      <button class="theme" id="theme" type="button" aria-label="Đổi giao diện sáng/tối">Theme</button>
    </div>
  </header>

  <div class="hero">
    <h1>after<em>ROCK</em></h1>
    <p>Hub tổng — mọi trang con, site và bản thử nghiệm ở một chỗ.</p>
  </div>

  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="Lọc trang"></div>
    <span class="count" id="count"></span>
  </div>

  <main id="sections"></main>

  <footer>
    <span>From Gang Thép Auto with love · since MMXXIV</span>
    <span id="ver2"></span>
  </footer>
</div>

<script>
/* ── Version ─────────────────────────────── */
const VERSION = "v1.0";
const BUILT   = "2026-10-20";

/* ── Danh sách trang con ─────────────────────
   Thêm trang mới: thêm 1 object vào PAGES.
   group: "site" (đang chạy trên web) | "lab" (Claude artifact, chỉ bạn mở được)
------------------------------------------------ */
const PAGES = [
  { group:"site", name:"VI",        kind:"Wiki",       color:"var(--pink)",
    desc:"Grand Theft Auto VI — countdown, timeline tin tức, gameplay.",
    href:"VI/", host:"afterrock / VI", ver:"v0.3" },
  { group:"site", name:"Count­down", kind:"Deadlines", color:"var(--teal)", long:true,
    desc:"Đếm ngược deadline ngắn / trung / dài hạn, kèm GTA VI.",
    href:"https://zuilopez.github.io/countdown/", host:"zuilopez.github.io/countdown", ver:"V94" },

  { group:"lab", name:"Game Library", kind:"Artifact", color:"var(--orange)", long:true,
    desc:"Thư viện game cá nhân.",
    href:"https://claude.ai/code/artifact/967f1b11-9ece-4150-9618-fb1909747671", host:"claude.ai" },
  { group:"lab", name:"Design System", kind:"Artifact", color:"var(--dusk)", long:true,
    desc:"Màu, font, thành phần dùng chung cho các site.",
    href:"https://claude.ai/code/artifact/3d3a3d6b-e995-4daf-b050-cab6f0d92b9b", host:"claude.ai" },
  { group:"lab", name:"VI × GI", kind:"Infographic", color:"var(--pink)",
    desc:"GTA VI × Game Informer — infographic 4:5.",
    href:"https://claude.ai/code/artifact/7cde2c1b-75e5-46cd-aaf8-0a9a906be3ee", host:"claude.ai" },
  { group:"lab", name:"VI Hub demo", kind:"Prototype", color:"var(--teal)", long:true,
    desc:"Bản demo đầu tiên của GTA VI Hub.",
    href:"https://claude.ai/code/artifact/64a8b6e5-a818-4fed-9486-221f95bde741", host:"claude.ai" },
  { group:"lab", name:"Leonida Log", kind:"Artifact", color:"var(--orange)", long:true,
    desc:"Bản artifact của trang VI (bản làm việc).",
    href:"https://claude.ai/code/artifact/0ad90e80-c8f1-426e-82ab-232098b5e855", host:"claude.ai" },
  { group:"lab", name:"Count­down", kind:"Artifact", color:"var(--dusk)", long:true,
    desc:"Bản artifact của trang Countdown (bản làm việc).",
    href:"https://claude.ai/code/artifact/1d4d6f29-edf5-4d2b-ac2b-6c4d629e8197", host:"claude.ai" },
];

const GROUPS = {
  site:{ label:"Sites", note:"Live trên web" },
  lab: { label:"Lab",   note:"Claude artifacts · riêng tư" },
};

/* ── Render ───────────────────────────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let filter = "all";

function render(){
  const out = [];
  let shown = 0;
  for (const [key, g] of Object.entries(GROUPS)){
    if (filter !== "all" && filter !== key) continue;
    const items = PAGES.filter(p => p.group === key);
    if (!items.length) continue;
    shown += items.length;
    const tiles = items.map((p,i) => {
      const ext = /^https?:/.test(p.href);
      return `<a class="tile" href="${esc(p.href)}"${ext ? ' target="_blank" rel="noopener"' : ""} style="--c:${p.color}">
        <div class="top"><span>${String(i+1).padStart(2,"0")} / ${String(items.length).padStart(2,"0")}</span>
          <span class="tag"><i></i>${esc(p.kind)}</span></div>
        <strong${p.long ? ' class="long"' : ""}>${p.name}</strong>
        <div><p class="d">${esc(p.desc)}</p>
          <div class="meta"><span>${esc(p.host)}${ext ? " ↗" : " →"}</span>${p.ver ? `<b>${esc(p.ver)}</b>` : ""}</div></div>
      </a>`;
    }).join("");
    out.push(`<section><h2>${g.label} <span>${g.note} · ${items.length}</span></h2><div class="grid">${tiles}</div></section>`);
  }
  $("#sections").innerHTML = out.join("");
  $("#count").textContent = `${shown} trang`;
}

function chips(){
  const opts = [["all","Tất cả"], ...Object.entries(GROUPS).map(([k,g]) => [k,g.label])];
  $("#chips").innerHTML = opts.map(([k,l]) => `<button type="button" data-f="${k}" aria-pressed="${k===filter}">${l}</button>`).join("");
  $("#chips").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f; chips(); render();
  };
}

/* ── Theme (sáng mặc định cho khách mới) ── */
function getTheme(){ try { return localStorage.getItem("ar-theme"); } catch { return null; } }
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("ar-theme", t); } catch {}
}
setTheme(getTheme() || "light");
$("#theme").onclick = () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

$("#ver").textContent  = `Hub ${VERSION}`;
$("#ver2").textContent = `afterROCK hub ${VERSION} · ${BUILT}`;
chips(); render();
</script>
</body>
</html>
