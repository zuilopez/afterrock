<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>afterROCK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0b0a10;--fg:#f2f2f4;--muted:#8d8794;--line:#25222c;--pink:#ff6bd0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
header b{color:var(--fg);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));border-left:1px solid var(--line);margin-top:40px}
a.tile{display:flex;flex-direction:column;justify-content:space-between;gap:40px;min-height:260px;padding:16px;border:1px solid var(--line);border-left:0;text-decoration:none;color:inherit;transition:background .3s}
a.tile:hover,a.tile:focus-visible{background:#16131c;outline:none}
.tile .top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile strong{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:140px;line-height:.8;color:var(--pink)}
.tile span.d{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><b>afterROCK</b><span>Index · 01</span></header>
  <div class="grid">
    <a class="tile" href="/VI/">
      <div class="top"><span>01 / 01</span><span>Wiki</span></div>
      <strong>VI</strong>
      <span class="d">Grand Theft Auto VI — countdown, timeline, gameplay →</span>
    </a>
  </div>
</div>
</body>
</html>
