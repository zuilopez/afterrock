name: Daily GTA VI news

on:
  schedule:
    - cron: "17 23 * * *"   # 06:17 ICT every day
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python scripts/fetch_news.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- VI/news.json; then echo "No new news"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add VI/news.json
          git commit -m "News: daily update $(date -u +%F)"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
